# CodeRabbit configuration for InstaSetter
# https://docs.coderabbit.ai/guides/configuration-overview/
language: en-US
early_access: false
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    base_branches:
      - main
      - feat/sofia-roadmap
      - feat/p4-base
      - feat/p3-01-push-emails-close
      - feat/p5-01-utm-tracking
chat:
  auto_reply: true
